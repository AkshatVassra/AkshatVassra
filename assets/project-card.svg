
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-label="FRA ATLAS project card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="818" height="168" rx="14" fill="url(#bg)" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="1" y="1" width="8" height="168" rx="4" fill="url(#accent)"/>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="42" y="52" font-size="12" letter-spacing="3" fill="#ef4444" font-weight="bold">FEATURED PROJECT</text>
    <text x="42" y="98" font-size="36" font-weight="bold" fill="#ffffff">FRA ATLAS</text>
  </g>
  <text x="42" y="132" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#a3a3a3">AkshatVassra / Forestt-Act-Project</text>

  <rect x="610" y="62" width="176" height="44" rx="22" fill="#b91c1c"/>
  <text x="698" y="90" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">View repository  →</text>

  <circle cx="560" cy="40" r="4" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="572" y="45" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#fca5a5">In progress</text>
</svg>
